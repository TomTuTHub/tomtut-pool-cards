name: Validate HACS

# BIS ZUM ERSTEN RELEASE bewusst KEIN push/pull_request/schedule.
# Solange das GitHub-Repo privat ist und weder Topics noch Release hat,
# scheitern drei HACS-Checks zwangslaeufig (Stand 26.09.2026, jeder Push rot):
#   - topics:   "The repository has no valid topics"
#   - images:   "The repository does not have images in the Readme file"
#   - hacsjson: "The repository has an invalid 'hacs.json' file"
# images + hacsjson sind KEINE echten Fehler: hacs/action laedt README.md und
# hacs.json unauthentifiziert von raw.githubusercontent.com — bei einem
# privaten Repo kommt 404 zurueck. README enthaelt ein Bild, hacs.json ist gueltig.
#
# TODO nach dem Release (Repo public + Topics gesetzt): push und pull_request
# hier wieder aktivieren:
#   push:
#   pull_request:
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - "v*"

# Leserecht auf den Inhalt ist Pflicht, solange das Repo privat ist: mit
# `permissions: {}` darf der GITHUB_TOKEN ein privates Repo nicht einmal
# lesen, und hacs/action bricht vor jeder Pruefung mit "invalid_token /
# Resource not accessible by integration" ab (alle Laeufe seit 19.09.2026).
# Bei oeffentlichen Repos ist das Recht ohnehin implizit — es schadet nicht.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
