name: Validate HACS

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: "17 3 * * *"

# Nur Leserecht: hacs/action prueft das Repo, schreibt nichts.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
